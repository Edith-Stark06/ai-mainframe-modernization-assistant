[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Ai-mainframe-modernization-assistant"
version = "0.1.0"
description = "Enterprise AI platform for understanding and modernizing IBM Z mainframe applications."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Ramana Sree, Verona Ann Mariya" }
]

# Exact-pinned (not just floor-pinned): an unpinned "ruff" and an
# unpinned Streamlit each independently broke CI within the same hour
# (ruff 0.16 expanded its default rule set; Streamlit's AppTest gained a
# stricter, correct disabled-widget check that a latent test-ordering
# bug had never tripped before). Every version below is the exact one
# this codebase's full test suite, black, ruff, and mypy are currently
# verified green under. Bumping any of them is a deliberate, separate
# change -- re-run the full suite before raising a pin.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "streamlit==1.64.0",
    "langchain==1.4.2",
    "langchain-community==0.4.2",
    "langchain-ollama==1.1.0",
    "chromadb==1.5.9",
    "sentence-transformers==6.1.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    "loguru==0.7.3",
    "chardet==7.6.0",
    "httpx==0.28.1"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.15.20",
    "mypy==2.3.1"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests that download/load a real model or otherwise take noticeably longer than the rest of the suite",
]