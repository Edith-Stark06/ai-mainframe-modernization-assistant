[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Ai-mainframe-modernization-assistant"
version = "0.1.0"
description = "Enterprise AI platform for understanding and modernizing IBM Z mainframe applications."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Ramana Sree, Verona Ann Mariya" }
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "chromadb",
    "sentence-transformers",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "aiofiles",
    "loguru",
    "chardet",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    # Pinned: ruff 0.16 expanded its default rule set (adds flake8-comprehensions,
    # isort, and others beyond the E4/E7/E9/F this project's lint pass was
    # actually validated against), which silently broke CI's unpinned install
    # with ~977 pre-existing violations unrelated to any real change. Pin to
    # the version this codebase is actually clean under; bump deliberately.
    "ruff==0.15.20",
    "mypy"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]