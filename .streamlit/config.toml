# GENERATED from app/frontend/design/tokens.py -- do not edit by hand.
# Regenerate: python -m app.frontend.design.streamlit_theme > .streamlit/config.toml
# (tests/frontend/test_streamlit_config.py fails if this file drifts.)

[browser]
gatherUsageStats = false

[client]
# "minimal" hides the Deploy button but keeps the menu (Settings > Theme).
toolbarMode = "minimal"

[server]
# Serves the bundled fonts (app/frontend/static/fonts) -- no third-party
# font request is ever made.
enableStaticServing = true

[theme]
font = "Inter"
headingFont = "Source Serif 4"
codeFont = "JetBrains Mono"
baseFontSize = 15
codeFontSize = "0.8125rem"
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.0625rem", "1rem", "0.875rem"]
headingFontWeights = [500, 500, 500, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Variable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Source Serif 4"
url = "app/static/fonts/SourceSerif4-Variable.woff2"
weight = "200 900"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/JetBrainsMono-Variable.woff2"
weight = "100 800"
style = "normal"

