services:
  api:
    build: .
    image: mainframe-modernization-assistant:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      WORKSPACE_DIR: /app/workspace
      LOG_LEVEL: INFO
      WARM_EMBEDDINGS: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      # Hosted Claude (LLM_PROVIDER=anthropic). Passed through from the host
      # environment / .env; blank when unset. Never baked into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      # NVIDIA NIM (LLM_PROVIDER=nvidia); blank when unset, never baked into the image.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-deepseek-ai/deepseek-v4.1-flash}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
    volumes:
      - workspace-data:/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: .
    image: mainframe-modernization-assistant:latest
    command: ["streamlit", "run", "app/frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy

volumes:
  workspace-data:
